<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du compte bancaire</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .info {
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 3px;
    }
    .value {
      font-weight: bold;
      color: #333;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn-copy {
      background-color: #e0e0e0;
      color: #333;
    }
    .btn-copy:hover {
      background-color: #d0d0d0;
    }
    .btn-whatsapp {
      width: 100%;
      padding: 12px;
      background-color: #25D366;
      color: white;
      font-weight: bold;
      font-size: 15px;
      margin-top: 10px;
    }
    .btn-whatsapp:hover {
      background-color: #1ebd56;
    }
  </style>
</head>
<body>

  <h2>Informations Bancaires</h2>

  <div class="field">
    <div class="info">
      <span class="label">Titulaire du compte</span>
      <span class="value" id="holder">ALSAADNI SAMER</span>
    </div>
    <button class="btn-copy" onclick="copyToClipboard('holder')">Copier</button>
  </div>

  <div class="field">
    <div class="info">
      <span class="label">IBAN</span>
      <span class="value" id="iban">BE71 0638 3062 4169</span>
    </div>
    <button class="btn-copy" onclick="copyToClipboard('iban')">Copier</button>
  </div>

  <div class="field">
    <div class="info">
      <span class="label">Banque</span>
      <span class="value" id="bank">Belfius</span>
    </div>
    <button class="btn-copy" onclick="copyToClipboard('bank')">Copier</button>
  </div>

  <div class="field">
    <div class="info">
      <span class="label">Type de compte</span>
      <span class="value" id="account-type">CPTE SERV.BANCAIRE DE BASE</span>
    </div>
    <button class="btn-copy" onclick="copyToClipboard('account-type')">Copier</button>
  </div>

  <button class="btn-whatsapp" onclick="sendWhatsApp()">Partager sur WhatsApp</button>

  <script>
    function copyToClipboard(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Copié dans le presse-papier : " + text);
      });
    }

    function sendWhatsApp() {
      const holder = document.getElementById('holder').innerText;
      const iban = document.getElementById('iban').innerText;
      const bank = document.getElementById('bank').innerText;
      const type = document.getElementById('account-type').innerText;

      const message = `Informations Bancaires:\n- Titulaire: ${holder}\n- IBAN: ${iban}\n- Banque: ${bank}\n- Type: ${type}`;
      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
      
      window.open(whatsappUrl, '_blank');
    }
  </script>

</body>
</html>
